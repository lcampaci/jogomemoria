<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="./icon-192.png">
  <meta name="author" content="Luis Henrique Campaci">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#22c55e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Jogo da Memória</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      gap: 15px;
      justify-content: center;
    }

    .card {
      width: 100px;
      height: 100px;
      background: #ffffff22;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s;
    }

    .card.flip {
      transform: rotateY(180deg);
    }

    .front,
    .back {
      width: 100%;
      height: 100%;
      position: absolute;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      backface-visibility: hidden;
    }

    .front {
      background: white;
      color: black;
      transform: rotateY(180deg);
    }

    .back {
      background: #ff9800;
    }

    .status {
      margin-top: 20px;
      font-size: 20px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ff9800;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #e68900;
    }

    @media (max-width: 500px) {
      .game-board {
        grid-template-columns: repeat(4, 70px);
      }

      .card {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🧠 Jogo da Memória</h1>

    <div class="game-board" id="gameBoard"></div>

    <div class="status">
      Pontos: <span id="score">0</span>
    </div>

    <button onclick="startGame()">Reiniciar</button>
  </div>

  <script>
    const emojis = ['🍎', '🚗', '🐶', '⚽', '🎵', '🌟', '🍕', '🎮', '🎃', '🕷️', '🐝', '👑'];
    let cards = [...emojis, ...emojis];

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let score = 0;

    const gameBoard = document.getElementById('gameBoard');
    const scoreElement = document.getElementById('score');

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function createCard(emoji) {
      const card = document.createElement('div');
      card.classList.add('card');

      card.innerHTML = `
        <div class="front">${emoji}</div>
        <div class="back">?</div>
      `;

      card.dataset.emoji = emoji;

      card.addEventListener('click', flipCard);

      return card;
    }

   function flipCard() {
  if (lockBoard) return;
  if (this === firstCard) return;

  // vibra ao tocar na carta
  vibrar(30);

  this.classList.add('flip');

  if (!firstCard) {
    firstCard = this;
    return;
  }

  secondCard = this;

  checkMatch();
}

    function checkMatch() {
  const isMatch =
    firstCard.dataset.emoji === secondCard.dataset.emoji;

  if (isMatch) {

    // vibração de sucesso
    vibrar([80, 40, 120]);

    disableCards();

    score++;
    scoreElement.textContent = score;

    if (score === emojis.length) {
      setTimeout(() => {
        vibrar([200, 100, 200, 100, 300]);
        alert('🎉 Você venceu!');
      }, 500);
    }

  } else {

    // vibração de erro
    vibrar([200]);

    unflipCards();
  }
}


    function disableCards() {
      firstCard.removeEventListener('click', flipCard);
      secondCard.removeEventListener('click', flipCard);

      resetBoard();
    }

  /* =========================
      VIBRAÇÃO
     ========================= */

function vibrar(tempo = 40) {

  // alguns navegadores precisam disso
  if (!("vibrate" in navigator)) {
    return;
  }

  navigator.vibrate(tempo);
}

    function unflipCards() {
      lockBoard = true;

      setTimeout(() => {
        firstCard.classList.remove('flip');
        secondCard.classList.remove('flip');

        resetBoard();
      }, 1000);
    }

    function resetBoard() {
      [firstCard, secondCard, lockBoard] = [null, null, false];
    }

    function startGame() {
      gameBoard.innerHTML = '';
      score = 0;
      scoreElement.textContent = score;

      const shuffledCards = shuffle(cards);

      shuffledCards.forEach(emoji => {
        const card = createCard(emoji);
        gameBoard.appendChild(card);
      });
    }

    startGame();

     window.addEventListener("resize", fixViewport);
window.addEventListener("orientationchange", fixViewport);
fixViewport();


    if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js").then(() => {
                    console.log("PWA instalada!");
                }).catch(err => {
                    console.log("Erro:", err);

                });
            });
        }
  </script>

</body>
</html>
